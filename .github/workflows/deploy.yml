name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REPO: galylioai/backend-new-infra

jobs:
  build-and-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - otp-service
          - favorites-service
          - alerts-service
          - mail-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,infra/scripts/health-check.sh,infra/scripts/rollback.sh"
          target: "/opt/app/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            TAG="${{ steps.sha.outputs.tag }}"
            COMPOSE="/opt/app/docker-compose.prod.yml"
            ENV_FILE="/etc/app/secrets/.env"

            echo "=== Deploying tag: ${TAG} ==="

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE_TAG="${TAG}" docker compose -f "${COMPOSE}" --env-file "${ENV_FILE}" pull

            [ -f /opt/app/.last_deployed_tag ] && \
              cp /opt/app/.last_deployed_tag /opt/app/.previous_tag || true
            echo "${TAG}" > /opt/app/.last_deployed_tag

            for svc in auth-service user-service otp-service \
                       favorites-service alerts-service mail-service api-gateway; do
              echo "--- Updating ${svc} ---"
              IMAGE_TAG="${TAG}" \
                docker compose -f "${COMPOSE}" --env-file "${ENV_FILE}" \
                up -d --no-deps "${svc}"
              sleep 4
            done

            echo "=== Waiting for gateway health ==="
            for i in $(seq 1 12); do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health || echo "000")
              if [ "${HTTP}" = "200" ]; then
                echo "Gateway healthy (attempt ${i})"
                break
              fi
              echo "Attempt ${i}/12: HTTP ${HTTP}; waiting 5s"
              sleep 5
              if [ "${i}" = "12" ]; then
                echo "DEPLOY FAILED: gateway not healthy after 60s"
                exit 1
              fi
            done

            docker image prune -f --filter "until=72h"

            echo "=== Deploy complete: ${TAG} ==="
