name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REPO: galylioai/backend-new-infra

jobs:
  build-and-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - otp-service
          - favorites-service
          - alerts-service
          - mail-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/docker-compose.prod.yml,backend/infra/scripts/health-check.sh,backend/infra/scripts/rollback.sh,backend/infra/scripts/08-materialize-secrets.sh"
          target: "/opt/app/"
          strip_components: 1

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            TAG="${{ steps.sha.outputs.tag }}"
            COMPOSE="/opt/app/docker-compose.prod.yml"
            ENV_FILE="/etc/app/secrets/.env"

            echo "=== Deploying tag: ${TAG} ==="
            bash /opt/app/infra/scripts/08-materialize-secrets.sh

            get_env_value() {
              grep -E "^$1=" "${ENV_FILE}" 2>/dev/null | tail -n1 | cut -d= -f2- || true
            }

            APP_INTERNAL_NETWORK="$(get_env_value APP_INTERNAL_NETWORK)"
            APP_INTERNAL_NETWORK="${APP_INTERNAL_NETWORK:-app_internal}"
            APP_DOCKER_SUBNET="$(get_env_value APP_DOCKER_SUBNET)"
            APP_DOCKER_SUBNET="${APP_DOCKER_SUBNET:-172.18.0.0/16}"
            APP_DOCKER_GATEWAY="$(get_env_value APP_DOCKER_GATEWAY)"
            APP_DOCKER_GATEWAY="${APP_DOCKER_GATEWAY:-172.18.0.1}"
            GATEWAY_BIND_IP="$(get_env_value GATEWAY_BIND_IP)"
            if systemctl is-active --quiet nginx; then
              GATEWAY_BIND_IP="${GATEWAY_BIND_IP:-127.0.0.1}"
              TRUSTED_PROXY_CIDRS="127.0.0.1/32,::1/128,${APP_DOCKER_GATEWAY}/32"
            else
              GATEWAY_BIND_IP="0.0.0.0"
              TRUSTED_PROXY_CIDRS="127.0.0.1/32,::1/128"
              echo "Nginx is not active; exposing api-gateway on 0.0.0.0:8080 for direct IP testing."
            fi

            export APP_INTERNAL_NETWORK APP_DOCKER_SUBNET APP_DOCKER_GATEWAY GATEWAY_BIND_IP TRUSTED_PROXY_CIDRS

            if ! docker network inspect "${APP_INTERNAL_NETWORK}" >/dev/null 2>&1; then
              docker network create \
                --driver bridge \
                --subnet "${APP_DOCKER_SUBNET}" \
                --gateway "${APP_DOCKER_GATEWAY}" \
                "${APP_INTERNAL_NETWORK}"
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE_TAG="${TAG}" docker compose -f "${COMPOSE}" --env-file "${ENV_FILE}" pull

            [ -f /opt/app/.last_deployed_tag ] && \
              cp /opt/app/.last_deployed_tag /opt/app/.previous_tag || true
            echo "${TAG}" > /opt/app/.last_deployed_tag

            for svc in auth-service user-service otp-service \
                       favorites-service alerts-service mail-service api-gateway; do
              echo "--- Updating ${svc} ---"
              IMAGE_TAG="${TAG}" \
                docker compose -f "${COMPOSE}" --env-file "${ENV_FILE}" \
                up -d --no-deps "${svc}"
              sleep 4
            done

            echo "=== Waiting for gateway health ==="
            for i in $(seq 1 24); do
              HTTP="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health 2>/dev/null || true)"
              HTTP="${HTTP:-000}"
              if [ "${HTTP}" = "200" ]; then
                echo "Gateway healthy (attempt ${i})"
                break
              fi
              echo "Attempt ${i}/24: HTTP ${HTTP}; waiting 5s"
              sleep 5
              if [ "${i}" = "24" ]; then
                echo "DEPLOY FAILED: gateway not healthy after 120s"
                docker compose -f "${COMPOSE}" --env-file "${ENV_FILE}" ps || true
                docker logs app-api-gateway-1 --tail 160 || true
                for svc in auth-service user-service otp-service favorites-service alerts-service mail-service; do
                  docker logs "app-${svc}-1" --tail 60 || true
                done
                exit 1
              fi
            done

            bash /opt/app/infra/scripts/health-check.sh

            docker image prune -f --filter "until=72h"

            echo "=== Deploy complete: ${TAG} ==="
