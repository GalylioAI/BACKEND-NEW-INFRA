# Production Docker Compose - stateless application containers only.
# PostgreSQL, Redis, RabbitMQ, PgBouncer, and Nginx run on the VPS host.

x-common: &common
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"
  extra_hosts:
    - "host.docker.internal:${APP_DOCKER_GATEWAY:-172.18.0.1}"

x-db-pool: &db_pool
  DB_HOST: host.docker.internal
  DB_MAX_OPEN_CONNS: "5"
  DB_MAX_IDLE_CONNS: "2"

networks:
  internal:
    name: ${APP_INTERNAL_NETWORK:-app_internal}
    external: true
  gateway-net:
    driver: bridge

services:
  api-gateway:
    <<: *common
    image: ghcr.io/galylioai/backend-new-infra/api-gateway:${IMAGE_TAG}
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      APP_PORT: "8080"
      APP_ENV: production
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      RS256_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_SIGNING_ALGORITHM: ${JWT_SIGNING_ALGORITHM:-RS256}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-Request-Id,X-Confirm}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-600}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      OTP_SERVICE_URL: http://otp-service:8083
      FAVORITES_SERVICE_URL: http://favorites-service:8084
      ALERTS_SERVICE_URL: http://alerts-service:8085
      REDIS_URL_FILE: /run/secrets/redis_url_gateway
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
    secrets:
      - source: jwt_public
        target: jwt_public.pem
      - internal_secret
      - redis_url_gateway
    depends_on:
      - auth-service
      - user-service
      - otp-service
      - favorites-service
      - alerts-service
    networks:
      - internal
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  auth-service:
    <<: *common
    image: ghcr.io/galylioai/backend-new-infra/auth-service:${IMAGE_TAG}
    environment:
      <<: *db_pool
      APP_PORT: "8081"
      APP_ENV: production
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_PORT: "6433"
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD_FILE: /run/secrets/auth_db_password
      MIGRATION_DATABASE_URL_FILE: /run/secrets/auth_db_migration_url
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_SIGNING_ALGORITHM: ${JWT_SIGNING_ALGORITHM:-RS256}
      EMAIL_VERIFICATION_OTP_EXPIRY: ${EMAIL_VERIFICATION_OTP_EXPIRY:-10m}
      PASSWORD_RESET_OTP_EXPIRY: ${PASSWORD_RESET_OTP_EXPIRY:-10m}
      PASSWORD_RESET_TOKEN_EXPIRY: ${PASSWORD_RESET_TOKEN_EXPIRY:-15m}
      TWO_FACTOR_LOGIN_OTP_EXPIRY: ${TWO_FACTOR_LOGIN_OTP_EXPIRY:-10m}
      TWO_FACTOR_ENABLE_OTP_EXPIRY: ${TWO_FACTOR_ENABLE_OTP_EXPIRY:-10m}
      TWO_FACTOR_DISABLE_OTP_EXPIRY: ${TWO_FACTOR_DISABLE_OTP_EXPIRY:-10m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      JWT_2FA_PENDING_EXPIRY: ${JWT_2FA_PENDING_EXPIRY}
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      USER_SERVICE_URL: http://user-service:8082
      OTP_SERVICE_URL: http://otp-service:8083
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/auth}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-Strict}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_HTTPONLY: ${REFRESH_COOKIE_HTTPONLY:-true}
      REFRESH_COOKIE_MAX_AGE: ${REFRESH_COOKIE_MAX_AGE:-720h}
    secrets:
      - source: jwt_private
        target: jwt_private.pem
      - source: jwt_public
        target: jwt_public.pem
      - internal_secret
      - rabbitmq_url
      - auth_db_password
      - auth_db_migration_url
      - google_client_secret
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  user-service:
    <<: *common
    image: ghcr.io/galylioai/backend-new-infra/user-service:${IMAGE_TAG}
    environment:
      <<: *db_pool
      APP_PORT: "8082"
      APP_ENV: production
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_PORT: "6434"
      DB_NAME: user_db
      DB_USER: user_user
      DB_PASSWORD_FILE: /run/secrets/user_db_password
      MIGRATION_DATABASE_URL_FILE: /run/secrets/user_db_migration_url
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      AUTH_SERVICE_URL: http://auth-service:8081
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_DURATION: ${ACCOUNT_LOCKOUT_DURATION:-15m}
      RECENT_AUTH_WINDOW: ${RECENT_AUTH_WINDOW:-10m}
    networks:
      - internal
    secrets:
      - internal_secret
      - rabbitmq_url
      - user_db_password
      - user_db_migration_url
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  otp-service:
    <<: *common
    image: ghcr.io/galylioai/backend-new-infra/otp-service:${IMAGE_TAG}
    environment:
      <<: *db_pool
      APP_PORT: "8083"
      APP_ENV: production
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_PORT: "6435"
      DB_NAME: otp_db
      DB_USER: otp_user
      DB_PASSWORD_FILE: /run/secrets/otp_db_password
      MIGRATION_DATABASE_URL_FILE: /run/secrets/otp_db_migration_url
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      USER_SERVICE_URL: http://user-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_SIGNING_ALGORITHM: ${JWT_SIGNING_ALGORITHM:-RS256}
      EMAIL_VERIFICATION_OTP_EXPIRY: ${EMAIL_VERIFICATION_OTP_EXPIRY:-10m}
      PASSWORD_RESET_OTP_EXPIRY: ${PASSWORD_RESET_OTP_EXPIRY:-10m}
      PASSWORD_RESET_TOKEN_EXPIRY: ${PASSWORD_RESET_TOKEN_EXPIRY:-15m}
      TWO_FACTOR_LOGIN_OTP_EXPIRY: ${TWO_FACTOR_LOGIN_OTP_EXPIRY:-10m}
      TWO_FACTOR_ENABLE_OTP_EXPIRY: ${TWO_FACTOR_ENABLE_OTP_EXPIRY:-10m}
      TWO_FACTOR_DISABLE_OTP_EXPIRY: ${TWO_FACTOR_DISABLE_OTP_EXPIRY:-10m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
      OTP_RESEND_COOLDOWN: ${OTP_RESEND_COOLDOWN:-1m}
    secrets:
      - source: jwt_public
        target: jwt_public.pem
      - internal_secret
      - rabbitmq_url
      - otp_db_password
      - otp_db_migration_url
    depends_on:
      - auth-service
      - user-service
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  favorites-service:
    <<: *common
    image: ghcr.io/galylioai/backend-new-infra/favorites-service:${IMAGE_TAG}
    environment:
      <<: *db_pool
      APP_PORT: "8084"
      APP_ENV: production
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_PORT: "6436"
      DB_NAME: favorites_db
      DB_USER: favorites_user
      DB_PASSWORD_FILE: /run/secrets/favorites_db_password
      MIGRATION_DATABASE_URL_FILE: /run/secrets/favorites_db_migration_url
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
    networks:
      - internal
    secrets:
      - internal_secret
      - favorites_db_password
      - favorites_db_migration_url
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  alerts-service:
    <<: *common
    image: ghcr.io/galylioai/backend-new-infra/alerts-service:${IMAGE_TAG}
    environment:
      <<: *db_pool
      APP_PORT: "8085"
      APP_ENV: production
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_PORT: "6437"
      DB_NAME: alerts_db
      DB_USER: alerts_user
      DB_PASSWORD_FILE: /run/secrets/alerts_db_password
      MIGRATION_DATABASE_URL_FILE: /run/secrets/alerts_db_migration_url
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      INTERNAL_SECRET_FILE: /run/secrets/internal_secret
      USER_SERVICE_URL: http://user-service:8082
    networks:
      - internal
    secrets:
      - internal_secret
      - rabbitmq_url
      - alerts_db_password
      - alerts_db_migration_url
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  mail-service:
    <<: *common
    image: ghcr.io/galylioai/backend-new-infra/mail-service:${IMAGE_TAG}
    environment:
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url_mail
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      MAIL_FROM: ${MAIL_FROM}
      SENDGRID_API_KEY_FILE: /run/secrets/sendgrid_api_key
      APP_NAME: ${APP_NAME:-1111}
    networks:
      - internal
    secrets:
      - rabbitmq_url
      - redis_url_mail
      - smtp_pass
      - sendgrid_api_key
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

secrets:
  jwt_private:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/keys/private.pem
  jwt_public:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/keys/public.pem
  internal_secret:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/internal_secret
  redis_url_gateway:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/redis_url_gateway
  redis_url_mail:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/redis_url_mail
  rabbitmq_url:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/rabbitmq_url
  auth_db_password:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/auth_db_password
  user_db_password:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/user_db_password
  otp_db_password:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/otp_db_password
  favorites_db_password:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/favorites_db_password
  alerts_db_password:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/alerts_db_password
  auth_db_migration_url:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/auth_db_migration_url
  user_db_migration_url:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/user_db_migration_url
  otp_db_migration_url:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/otp_db_migration_url
  favorites_db_migration_url:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/favorites_db_migration_url
  alerts_db_migration_url:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/alerts_db_migration_url
  google_client_secret:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/google_client_secret
  smtp_pass:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/smtp_pass
  sendgrid_api_key:
    file: ${APP_SECRETS_DIR:-/etc/app/secrets}/runtime/sendgrid_api_key
