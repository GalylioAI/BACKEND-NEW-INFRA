services:
  postgres-user:
    ports:
      - "5434:5432"

  postgres-auth:
    ports:
      - "5433:5432"

  postgres-otp:
    ports:
      - "5435:5432"

  postgres-favorites:
    ports:
      - "5436:5432"

  postgres-alerts:
    ports:
      - "5437:5432"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8082:8082"

  auth-service:
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      COOKIE_SECURE: "false"
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAMESITE: Lax
      COOKIE_DOMAIN: ""
      REFRESH_COOKIE_DOMAIN: ""
    ports:
      - "8081:8081"

  otp-service:
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8083:8083"

  favorites-service:
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8084:8084"

  alerts-service:
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8085:8085"

  api-gateway:
    environment:
      APP_ENV: development
      DOCS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173

  mail-service:
    environment:
      MAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    networks: [internal-net]

networks:
  internal-net:
    internal: false
